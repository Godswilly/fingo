name: Quality Gates

on:
  pull_request:
    branches:
      - main
      - develop
  # Only post-merge on main. develop is validated by incoming PRs, so
  # triggering push here too would double-run many commits.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format Check
        run: make fmt-check

      - name: Secret scan
        run: CHECK_SECRETS_SCOPE=all scripts/check-secrets.sh

      - name: Architecture boundaries
        run: make boundary-check

      - name: go vet
        run: GOCACHE=/tmp/gocache GOMODCACHE=/tmp/gomodcache go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit Tests
        run: make test

      - name: Race Tests
        run: make test-race

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
    if: ${{ always() }}
    steps:
      - name: Verify dependencies passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
