run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - typecheck

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
    exclude-functions:
      - (net/http.ResponseWriter).Write

  revive:
    rules:
      - name: exported
        disabled: true

  goimports:
    local-prefixes: github.com/Godswilly/fingo

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
