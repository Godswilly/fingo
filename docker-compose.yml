services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fingo
      POSTGRES_USER: fingo
      POSTGRES_PASSWORD: fingo
    ports:
      - "5432:5432"
    volumes:
      - fingo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingo -d fingo"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  fingo_pgdata:
